project.name=Snake_
project.type=application
project.language=java
project.mainClass=App

source.root=Snake_
source.groups=Models,Views,Patterns,Services

source.files=\
  App.java,\
  Models/Cell.java,\
  Models/GameState.java,\
  Views/GamePanel.java,\
  Patterns/GameController.java,\
  Services/FoodService.java

product.name=Snake_
product.type=executable

java.source=17
java.target=17
encoding=UTF-8

build.phases=compile,package
build.compile.command=javac -encoding UTF-8 -d out App.java Models/*.java Views/*.java Patterns/*.java Services/*.java
build.run.command=java -cp out App
